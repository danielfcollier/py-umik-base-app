<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMIK-1 Spectrum Analyzer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="toolbar">
        <label>Calibration:</label>
        <input type="file" id="cal-file" accept=".txt">
        <button id="btn-load-cal">Load</button>
        <span id="cal-status">Not loaded</span>
        <span style="flex:1"></span>
        <button id="btn-record">&#9679; REC</button>
        <button id="btn-export">Export CSV</button>
    </div>
    <div id="plots">
        <div id="fft-container">
            <canvas id="fft-canvas"></canvas>
        </div>
        <div id="waterfall-container">
            <canvas id="waterfall-canvas"></canvas>
        </div>
    </div>
    <div id="status">
        <span id="stat-spl">dBSPL: --</span>
        <span id="stat-snr">SNR: --</span>
        <span id="stat-mic">Mic: --</span>
        <span style="flex:1"></span>
        <button id="btn-quiet-room">Capture Quiet Room</button>
    </div>
    <script src="js/fft_plot.js"></script>
    <script src="js/waterfall.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
